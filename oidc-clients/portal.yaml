# A server-rendered web app: users sign in in the browser, but the server exchanges the code
# and keeps the tokens. Confidential client, so the operator writes its secret to
# portal-oidc (fields client-id, client-secret) in the app's namespace.
apiVersion: keycloak.jugash.com/v1alpha1
kind: KeycloakClient
metadata:
  name: portal
  namespace: portal
spec:
  realm: api
  clientId: portal
  name: "Customer portal"
  publicClient: false
  standardFlowEnabled: true
  directAccessGrantsEnabled: false
  rootUrl: "https://portal.example.internal"
  # The server's exact callback: nothing else needs to receive codes.
  redirectUris:
    - "https://portal.example.internal/oauth/callback"
  postLogoutRedirectUris:
    - "https://portal.example.internal/"
  # No webOrigins: the browser never talks to Keycloak's token endpoint, the server does.
  defaultClientScopes:
    - profile
    - email
    - roles
  credentialsSecretRef:
    name: portal-oidc
  protocolMappers:
    - name: orders-api-audience
      protocol: openid-connect
      protocolMapper: oidc-audience-mapper
      config:
        included.custom.audience: orders-api
        access.token.claim: "true"
        id.token.claim: "false"
    - name: plan
      protocol: openid-connect
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: plan
        claim.name: plan
        jsonType.label: String
        access.token.claim: "true"
        id.token.claim: "false"
