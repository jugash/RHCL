# Use Manual in production so operator upgrades need an approved InstallPlan.
installPlanApproval: Automatic

serviceMesh:
  enabled: true
  # Dedicated namespace (not openshift-operators). The operator still watches all namespaces.
  # If OSSM 3 is already installed elsewhere on the cluster, remove that Subscription first:
  # OLM does not allow the same operator to be installed twice cluster-wide.
  namespace: servicemesh-operator
  channel: stable
  source: redhat-operators

# Installed into the release namespace (use kuadrant-system).
connectivityLink:
  enabled: true
  channel: stable
  source: redhat-operators
