{{- if .Values.serviceMesh.enabled }}
{{- $ns := .Values.serviceMesh.namespace }}
# OpenShift Service Mesh 3 (Sail-based Istio operator) in its own namespace.
# It only supports the AllNamespaces install mode, so the OperatorGroup has no targetNamespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    # Never delete on uninstall/prune (Helm and Argo CD respectively).
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: servicemesh-operator
  namespace: {{ $ns }}
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: {{ $ns }}
  annotations:
    # Never delete on uninstall/prune (Helm and Argo CD respectively).
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  channel: {{ .Values.serviceMesh.channel }}
  name: servicemeshoperator3
  source: {{ .Values.serviceMesh.source }}
  sourceNamespace: openshift-marketplace
  installPlanApproval: {{ .Values.installPlanApproval }}
{{- end }}
