{{- if .Values.connectivityLink.enabled }}
# Red Hat Connectivity Link. Pulls in Authorino, Limitador and the DNS operator as dependencies.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: kuadrant
  namespace: {{ .Release.Namespace }}
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: {{ .Release.Namespace }}
  annotations:
    # Never delete on uninstall/prune (Helm and Argo CD respectively).
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  channel: {{ .Values.connectivityLink.channel }}
  name: rhcl-operator
  source: {{ .Values.connectivityLink.source }}
  sourceNamespace: openshift-marketplace
  installPlanApproval: {{ .Values.installPlanApproval }}
{{- end }}
