{{- range $ns := list "istio-system" "istio-cni" .Values.gateway.namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    # Never delete on uninstall/prune (Helm and Argo CD respectively).
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
{{- end }}
