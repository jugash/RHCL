{{- if .Values.gateway.httpRedirect }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: {{ .Values.gateway.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- if .Values.defaults.denyAll }}
---
# The redirect route needs no credentials. This route-level policy replaces the gateway's deny-all default.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: https-redirect-public
  namespace: {{ .Values.gateway.namespace }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: https-redirect
  rules:
    authentication:
      public:
        anonymous: {}
{{- end }}
{{- end }}
