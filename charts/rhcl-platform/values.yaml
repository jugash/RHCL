mesh:
  # Empty = the operator's default (newest supported) Istio version.
  # After the first install, pin it: oc get istio default -o jsonpath='{.spec.version}'
  version: ""
  # PERMISSIVE while apps are still reached through OpenShift Routes as well.
  # Switch to STRICT once every meshed app is served only through the gateway.
  mtlsMode: PERMISSIVE
  accessLogs: true

# The Kuadrant CR goes into the release namespace (kuadrant-system).
kuadrant:
  enabled: true

# Make Authorino trust an internal CA, e.g. for OIDC/JWT with an IdP whose certificate it signed.
# When enabled, this chart owns the Authorino CR (instead of the Kuadrant operator creating it)
# and mounts the CA bundle into it. Not needed if you only use API keys.
authorino:
  trustedCA:
    enabled: false
    # Empty = a ConfigMap that OpenShift fills with the cluster trust bundle. Add your CA to that
    # bundle first: oc get proxy cluster -o jsonpath='{.spec.trustedCA.name}'
    # Or name your own ConfigMap in the release namespace. It replaces the image's CAs, so it must
    # be a full bundle: the public CAs plus yours.
    configMap: ""
    key: ca-bundle.crt

gateway:
  name: api-gateway
  namespace: api-gateway
  # Wildcard hostname for new APIs. Point *.api.example.internal at the gateway's LB IP in your DNS.
  hostname: "*.api.example.internal"
  # Optional extra HTTPS listeners, e.g. to keep a legacy hostname that used to be an OpenShift Route:
  #   - name: legacy-shop
  #     hostname: shop.apps.ocp.example.internal
  extraListeners: []
  # Namespaces need this label before their HTTPRoutes can attach (the rhcl-apis ApplicationSet adds it).
  accessLabel:
    api-gateway-access: "true"
  # Passed to the generated LoadBalancer Service. Pin the IP so the DNS record stays valid, e.g.:
  #   metallb.io/loadBalancerIPs: 10.0.0.50
  serviceAnnotations: {}
  # Redirect plain HTTP to HTTPS.
  httpRedirect: true

tls:
  enabled: true
  # Existing cert-manager issuer backed by your internal CA.
  issuer:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-ca

# Defaults for every route on the gateway. A route that has its own AuthPolicy/RateLimitPolicy replaces these.
defaults:
  # Deny any route that has no AuthPolicy of its own, so nothing is exposed by accident.
  denyAll: true
  rateLimit:
    enabled: true
    limit: 100
    window: 10s

# Ingress allow-rules for the platform's own namespaces (istio-system, the gateway namespace,
# kuadrant-system, the Service Mesh operator namespace), for clusters whose NetworkPolicies
# restrict traffic between namespaces. Allow-only and ingress-only: they never block anything.
# Note: a NetworkPolicy cannot override an AdminNetworkPolicy "Deny"; that needs an ANP exception.
networkPolicies:
  enabled: false
  serviceMeshOperatorNamespace: servicemesh-operator
  # Ports the gateway uses to call Kuadrant (Authorino and Limitador defaults).
  authorinoGrpcPort: 50051
  limitadorGrpcPort: 8081
