apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
spec:
  {{- with .Values.allowedNamespaces }}
  conditions:
    - namespaces:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  provider:
    vault:
      server: {{ .Values.server }}
      {{- with .Values.vaultNamespace }}
      namespace: {{ . }}
      {{- end }}
      path: {{ .Values.kvMount }}
      version: v2
      {{- if .Values.trustClusterCABundle }}
      caProvider:
        type: ConfigMap
        name: cluster-ca-bundle
        namespace: {{ .Values.serviceAccount.namespace }}
        key: ca-bundle.crt
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ .Values.auth.mountPath }}
          role: {{ .Values.auth.role }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
            namespace: {{ .Values.serviceAccount.namespace }}
