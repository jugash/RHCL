{{- if .Values.networkPolicies.enabled }}
{{- $ns := .Values.serviceAccount.namespace }}
# Ingress allow-rules for External Secrets, for clusters whose NetworkPolicies restrict traffic
# between namespaces. Allow-only and ingress-only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhcl-allow-same-namespace
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# The API server (host network) calls the External Secrets validation webhook.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhcl-allow-from-host-network
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhcl-allow-from-monitoring
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
{{- end }}
