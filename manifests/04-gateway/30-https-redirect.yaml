# Plain HTTP on port 80 is redirected to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: api-gateway
spec:
  parentRefs:
    - name: api-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# The redirect route needs no credentials. This route-level policy replaces the gateway's deny-all default.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: https-redirect-public
  namespace: api-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: https-redirect
  rules:
    authentication:
      public:
        anonymous: {}