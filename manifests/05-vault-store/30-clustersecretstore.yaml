# Lets External Secrets read API keys from Vault (KV v2), logging in with Kubernetes auth.
# Only kuadrant-system may use it. Must match what vault/setup.sh configured.
# EDIT: provider.vault.server (and mountPath/role if you changed them in vault/setup.sh).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  conditions:
    - namespaces:
        - kuadrant-system
  provider:
    vault:
      server: https://vault.example.internal:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: cluster-ca-bundle
        namespace: external-secrets
        key: ca-bundle.crt
      auth:
        kubernetes:
          mountPath: ocp-rhcl
          role: eso-rhcl
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
