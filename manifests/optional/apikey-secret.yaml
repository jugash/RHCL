# API key as a plain Secret, for clusters without Vault / External Secrets. NOT applied by apply.sh.
# Authorino picks up any Secret in kuadrant-system with these labels; the "api" label must match the
# selector in the API's AuthPolicy (examples/rhcl-ex-apikey uses api: echo).
#
# Never commit a real key. Generate one and apply without writing it to a file:
#   KEY=$(openssl rand -hex 24)
#   sed "s/REPLACE_WITH_KEY/$KEY/" manifests/optional/apikey-secret.yaml | oc apply -f -
#   echo "$KEY"
# Revoke by deleting the Secret.
apiVersion: v1
kind: Secret
metadata:
  name: apikey-echo-carol
  namespace: kuadrant-system
  labels:
    authorino.kuadrant.io/managed-by: authorino
    api: echo
  annotations:
    secret.kuadrant.io/user-id: carol
    secret.kuadrant.io/plan-id: free
type: Opaque
stringData:
  api_key: REPLACE_WITH_KEY
