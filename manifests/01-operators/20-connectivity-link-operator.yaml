# Connectivity Link runs here: the operator, Kuadrant, Authorino, Limitador, and the API-key Secrets.
apiVersion: v1
kind: Namespace
metadata:
  name: kuadrant-system
---
# Red Hat Connectivity Link. Pulls in Authorino, Limitador and the DNS operator as dependencies.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: kuadrant
  namespace: kuadrant-system
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: kuadrant-system
spec:
  channel: stable
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
