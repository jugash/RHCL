# OpenShift Service Mesh 3 (Sail-based Istio operator) in its own namespace.
# It only supports the AllNamespaces install mode, so the OperatorGroup has no targetNamespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: servicemesh-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: servicemesh-operator
  namespace: servicemesh-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: servicemesh-operator
spec:
  channel: stable
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
