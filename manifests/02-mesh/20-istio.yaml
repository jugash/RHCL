# One control plane for both the sidecar mesh and the gateway. Because the gateway is part of
# the mesh, gateway -> app traffic is mutual TLS automatically.
# Named "default" so the plain `istio-injection: enabled` namespace label works.
# istiod creates the `istio` GatewayClass.
#
# Do NOT also create a GatewayClass with controllerName openshift.io/gateway-controller/v1:
# that makes the OpenShift ingress operator start a second, gateway-only Istio.
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: istio-system
  # Unset = the operator's default version. Pin it after the first install (must match IstioCNI):
  #   oc get istio default -o jsonpath='{.spec.version}'
  # version: v1.x.y
  updateStrategy:
    type: InPlace
  values:
    meshConfig:
      accessLogFile: /dev/stdout
