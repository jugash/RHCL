# Set by bootstrap/root-app.yaml.
repoURL: ""
revision: main

# External Secrets Operator (upstream chart), used to sync API keys from Vault.
externalSecrets:
  enabled: true
  chartVersion: 2.12.0

# One Argo CD Application per apis/<namespace>/<api>.yaml.
apis:
  enabled: true

# Test APIs: plain manifests in examples/<namespace>/ (see scripts/test-examples.sh).
# Set to false to remove them all.
examples:
  enabled: true
