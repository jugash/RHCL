{{- if .Values.apis.enabled }}
# Wave 2: one Application per apis/<namespace>/<api>.yaml, installed with charts/api.
# The directory name is the namespace and the file name is the release name.
# Adding an API is a commit; deleting the file removes it.
{{ include "gitops.apiAppSet" (dict "root" . "name" "rhcl-apis" "dir" "apis" "appPrefix" "api") }}
{{- end }}
{{- if .Values.examples.enabled }}
---
# Wave 2: the test APIs in examples/. Each lives in its own new rhcl-ex-* namespace,
# so existing namespaces, Routes and Ingresses are never touched.
{{ include "gitops.apiAppSet" (dict "root" . "name" "rhcl-examples" "dir" "examples" "appPrefix" "example" "domain" .Values.examples.domain) }}
{{- end }}
