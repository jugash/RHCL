{{- if .Values.externalSecrets.enabled }}
# Wave 0: External Secrets Operator. Wave 1: the Vault ClusterSecretStore.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "gitops.wave" 0 | nindent 4 }}
spec:
  project: rhcl
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.externalSecrets.chartVersion }}
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        global:
          compatibility:
            openshift:
              # Argo renders charts without detecting the platform, so don't rely on "auto".
              adaptSecurityContext: force
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  # The cert controller injects CA bundles at runtime; don't treat that as drift.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    {{- include "gitops.syncPolicy" (dict "extraSyncOptions" (list "RespectIgnoreDifferences=true")) | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-store
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "gitops.wave" 1 | nindent 4 }}
spec:
  project: rhcl
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: charts/vault-store
    helm:
      valueFiles:
        - ../../site/vault-store-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    {{- include "gitops.syncPolicy" dict | nindent 4 }}
{{- end }}
