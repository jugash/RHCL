# Echo backend: replies with the request it received (headers included).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locked
  namespace: rhcl-ex-locked
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locked
  template:
    metadata:
      labels:
        app: locked
    spec:
      containers:
        - name: echo
          image: quay.io/kuadrant/authorino-examples:talker-api
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: locked
  namespace: rhcl-ex-locked
spec:
  selector:
    app: locked
  ports:
    - name: http
      port: 80
      targetPort: 3000
