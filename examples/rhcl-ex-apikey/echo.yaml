# API-key protected API with per-user limits by plan. Keys come from Vault; create them first:
#   scripts/vault-create-api-key.sh echo alice
#   scripts/vault-create-api-key.sh echo bob
# Hostname is set by the ApplicationSet: echo.<examples.domain>.
demo:
  enabled: true
auth:
  mode: protected
  apiKey:
    enabled: true
    consumers:
      - user: alice
        plan: gold
      - user: bob
        plan: free
    vault:
      # Pick up new or rotated keys quickly while testing.
      refreshInterval: 1m
  # To also test OIDC, set enabled: true and point issuerUrl at a realm on your IdP.
  oidc:
    enabled: false
    issuerUrl: https://sso.example.internal/realms/api
rateLimit:
  perUser:
    plans:
      free:
        limit: 3
        window: 10s
      gold:
        limit: 10
        window: 10s
  total:
    limit: 50
    window: 10s
