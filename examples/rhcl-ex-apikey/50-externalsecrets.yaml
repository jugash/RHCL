# API keys for two callers, read from Vault and synced into kuadrant-system.
# Create the keys in Vault first:
#   scripts/vault-create-api-key.sh echo alice
#   scripts/vault-create-api-key.sh echo bob
# To add a caller, copy a block. To revoke one, delete its block (the Secret goes with it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apikey-echo-alice
  # Authorino reads API keys from the Kuadrant namespace.
  namespace: kuadrant-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: apikey-echo-alice
    creationPolicy: Owner
    template:
      metadata:
        labels:
          authorino.kuadrant.io/managed-by: authorino
          api: echo
        annotations:
          secret.kuadrant.io/user-id: alice
          secret.kuadrant.io/plan-id: gold
  data:
    - secretKey: api_key
      remoteRef:
        key: rhcl/apikeys/echo/alice
        property: api_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apikey-echo-bob
  # Authorino reads API keys from the Kuadrant namespace.
  namespace: kuadrant-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: apikey-echo-bob
    creationPolicy: Owner
    template:
      metadata:
        labels:
          authorino.kuadrant.io/managed-by: authorino
          api: echo
        annotations:
          secret.kuadrant.io/user-id: bob
          secret.kuadrant.io/plan-id: free
  data:
    - secretKey: api_key
      remoteRef:
        key: rhcl/apikeys/echo/bob
        property: api_key
