# Attaches to the HTTPS listener of the shared gateway. The hostname must fall under the
# listener's hostname (gateway.hostname in site/platform-values.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: rhcl-ex-apikey
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-gateway
      namespace: api-gateway
      sectionName: https
  hostnames:
    - echo.api.example.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 80
