# Demo API with an echo backend. Create alice's key first:
#   scripts/vault-create-api-key.sh echo-api alice
hostnames:
  - echo.api.example.internal
demo:
  enabled: true
auth:
  mode: protected
  apiKey:
    enabled: true
    consumers:
      - user: alice
        plan: gold
  oidc:
    enabled: false   # true once issuerUrl points at your IdP
